marketing_attribution:
  target: dev
  outputs:
    dev:
      type: snowflake
      account:   "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user:      "{{ env_var('SNOWFLAKE_USER') }}"
      password:  "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role:      "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DBT_WH_XS') }}"
      database:  "{{ env_var('SNOWFLAKE_DATABASE', 'MARKETING_DB') }}"
      schema:    DBT
      threads: 4
      query_tag: "dbt-msc-capstone-p5"
